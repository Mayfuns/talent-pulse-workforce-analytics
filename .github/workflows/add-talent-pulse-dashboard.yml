name: Add Talent Pulse dashboard

on:
  push:
    paths:
      - '.github/workflows/add-talent-pulse-dashboard.yml'

permissions:
  contents: write

jobs:
  add-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download dashboard image
        shell: bash
        run: |
          set -e
          mkdir -p 01_dashboard
          curl -L --fail             "https://raw.githubusercontent.com/Mayfuns/mariam-analytics-portfolio/main/assets/images/talent-pulse.png"             -o "01_dashboard/talent-pulse-dashboard.png"
      - name: Commit dashboard image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_dashboard/talent-pulse-dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m "Add Talent Pulse dashboard image"
            git push
          fi

# one-off trigger
